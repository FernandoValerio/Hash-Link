[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hash-link"
version = "0.1.0"
description = "Identificação de arquivos e cálculo de hashes a partir de links."
readme = "README.md"
requires-python = ">=3.11"

authors = [
    { name = "Fernando Valerio" }
]

dependencies = [
    "PySide6>=6.7",
    "requests>=2.32",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"